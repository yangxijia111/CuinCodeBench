# Release 工作流：push v* tag 时构建 Windows 安装包与便携 zip 并发布 GitHub Release
# 产物只包含应用构建（NSIS 安装器 + zip），不含任何数据库/日志/工具链/用户数据。
# 构建未做代码签名：Release Notes 中已声明 SmartScreen 可能提示。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Package (NSIS + zip)
        run: npm run dist
        env:
          # 未签名构建：跳过代码签名步骤
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: true
          files: |
            dist/CuinCodeBench-Setup-*.exe
            dist/CuinCodeBench-*-win-x64.zip
