# Release 工作流：push v* tag 时构建 Windows 安装包与便携 zip 并发布 GitHub Release
# 产物只包含应用构建（NSIS 安装器 + zip），不含任何数据库/日志/工具链/用户数据。
# 构建未做代码签名：Release Notes 中已声明 SmartScreen 可能提示。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        shell: bash
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Build native launcher（必须实际编译，禁止提交二进制）
        run: npm run build:launcher

      - name: Package (NSIS + zip)
        # --publish never：禁用 electron-builder 的 tag 隐式发布（发布统一由 action-gh-release 负责）
        run: npm run dist -- --publish never
        env:
          # 未签名构建：跳过代码签名步骤
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package smoke：安装器与便携包必须携带 launcher
        shell: pwsh
        run: |
          $found = @()
          $zip = Get-ChildItem dist/CuinCodeBench-*-win-x64.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries |
            Where-Object { $_.FullName -like '*ccb-launcher.exe' }
          if ($entries.Count -eq 0) { throw "便携 zip 缺少 ccb-launcher.exe: $($zip.FullName)" }
          $found += "zip: $($entries.FullName)"
          # NSIS：安装器本体即 7z 容器，直接列内容断言 launcher（本地实测通过）
          $exe = Get-ChildItem dist/CuinCodeBench-Setup-*.exe | Select-Object -First 1
          $listing = & "C:\Program Files\7-Zip\7z.exe" l $exe.FullName | Select-String 'ccb-launcher\.exe'
          if ($null -eq $listing) { throw "NSIS 安装包缺少 ccb-launcher.exe: $($exe.FullName)" }
          $found += "nsis: $($listing[0].ToString().Trim())"
          Write-Host "launcher 打包验证通过: $found"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: true
          files: |
            dist/CuinCodeBench-Setup-*.exe
            dist/CuinCodeBench-*-win-x64.zip
