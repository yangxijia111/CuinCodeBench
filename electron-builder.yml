# electron-builder 配置
appId: com.cuin.codebench
productName: CuinCodeBench
directories:
  output: dist
  buildResources: resources/build
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - seed-problems.json
      - seed-learning-path.json
  # v1.3：native launcher（源码 native/ccb-launcher/，产物由构建脚本/CI 生成，gitignore）
  - from: native/bin
    to: bin
    filter:
      - ccb-launcher.exe
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
# 产物命名：顶层模板用于 zip；NSIS 在其配置节内覆盖为安装器命名
artifactName: CuinCodeBench-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CuinCodeBench
  artifactName: CuinCodeBench-Setup-${version}.${ext}
npmRebuild: true
