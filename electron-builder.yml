# electron-builder 配置
appId: com.cuin.codebench
productName: CuinCodeBench
directories:
  output: dist
  buildResources: resources/build
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - seed-problems.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
# Release 产物命名规范（RELEASE 工程化）：安装器 + 便携 zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CuinCodeBench
  artifactName: CuinCodeBench-Setup-${version}.${ext}
zip:
  artifactName: CuinCodeBench-${version}-win-x64.${ext}
npmRebuild: true
